<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Đại lý lốp xe Phương Linh ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff4d6d;
      --primary-hover: #ff758f;
      --accent: #c9184a;
      --bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --shadow: 0 16px 40px rgba(255, 77, 109, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      overflow-x: hidden;
      position: relative;
      color: #590d22;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
    }

    /* Hiệu ứng trái tim bay background */
    .heart-bg {
      position: fixed;
      top: -10vh;
      pointer-events: none;
      z-index: 1;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 720px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 40px 30px;
      box-shadow: var(--shadow);
      border: 2px solid rgba(255, 255, 255, 0.95);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge-tire {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 77, 109, 0.12);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.2rem;
      color: #800f2f;
      line-height: 1.35;
      margin-bottom: 12px;
      text-shadow: 2px 2px 4px rgba(255, 117, 143, 0.25);
    }

    .sub-greeting {
      font-size: 1.15rem;
      color: #a4133c;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .btn-sorry {
      position: relative;
      background: linear-gradient(45deg, #ff4d6d, #ff758f, #ff4d6d);
      background-size: 200% auto;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 77, 109, 0.45);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-sorry:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 14px 30px rgba(255, 77, 109, 0.6);
      background-position: right center;
    }

    .btn-sorry:active {
      transform: translateY(1px) scale(0.98);
    }

    /* Khung danh sách 100 lời xin lỗi */
    .apology-wrapper {
      margin-top: 36px;
      display: none;
      animation: expandIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes expandIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .progress-info {
      font-weight: 800;
      color: var(--accent);
      font-size: 1.15rem;
      margin-bottom: 16px;
    }

    .apology-list {
      max-height: 480px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      border: 1px dashed rgba(255, 77, 109, 0.5);
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    .apology-list::-webkit-scrollbar {
      width: 8px;
    }
    .apology-list::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .apology-item {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 179, 198, 0.6);
      opacity: 0;
      transform: translateY(15px);
      animation: popItem 0.35s ease forwards;
    }

    @keyframes popItem {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .apology-num {
      background: #ffccd5;
      color: #800f2f;
      font-size: 0.85rem;
      font-weight: 800;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .apology-text {
      font-size: 1.05rem;
      font-weight: 700;
      color: #590d22;
      text-align: left;
    }

    .sparkle {
      color: #ff4d6d;
    }

    /* Hiệu ứng pháo tim khi bấm */
    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 24px;
      animation: burstAnim 1.2s ease-out forwards;
    }

    @keyframes burstAnim {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(var(--rot));
      }
    }

    .sweet-footer {
      margin-top: 25px;
      font-family: 'Dancing Script', cursive;
      font-size: 1.9rem;
      color: #c9184a;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background Container -->
  <div id="heartBgContainer"></div>

  <div class="container">
    <div class="badge-tire">
      🛞 Cửa hàng sửa chữa & đại lí lốp xe 🛞
    </div>

    <h1>Hellu Đại lý lốp xe Phương Linh ❤️</h1>
    <p class="sub-greeting"> Đừng giận anh nữa, anh biết lỗi rùi</p>

    <button id="btnSorry" class="btn-sorry">
      <span>Bấm vào đây để nhận lời xin lỗi</span>
      <span style="font-size: 1.4rem;">💌</span>
    </button>

    <div id="apologyWrapper" class="apology-wrapper">
      <div class="progress-info" id="progressInfo">Đang gửi 100 lời xin lỗi chân thành nhất...</div>
      <div id="apologyList" class="apology-list"></div>
      <div class="sweet-footer">💕</div>
    </div>
  </div>

  <script>
    // 1. Tạo hiệu ứng trái tim bay ngẫu nhiên liên tục ở background
    const heartIcons = ['❤️', '💖', '💕', '💗', '💓', '💘', '🌸', '✨'];
    const heartBgContainer = document.getElementById('heartBgContainer');

    function createFloatingHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart-bg';
      heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      
      const left = Math.random() * 100;
      const duration = 6 + Math.random() * 6; // 6s - 12s
      const size = 16 + Math.random() * 26; // 16px - 42px
      
      heart.style.left = left + 'vw';
      heart.style.fontSize = size + 'px';
      heart.style.animationDuration = duration + 's';
      
      heartBgContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    for (let i = 0; i < 15; i++) {
      setTimeout(createFloatingHeart, i * 300);
    }
    setInterval(createFloatingHeart, 450);

    // 2. Hiệu ứng bùng nổ trái tim khi bấm nút
    function burstHearts(x, y) {
      for (let i = 0; i < 35; i++) {
        const heart = document.createElement('div');
        heart.className = 'burst-heart';
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        heart.style.left = x + 'px';
        heart.style.top = y + 'px';

        const angle = Math.random() * Math.PI * 2;
        const velocity = 80 + Math.random() * 160;
        const tx = Math.cos(angle) * velocity + 'px';
        const ty = Math.sin(angle) * velocity + 'px';
        const rot = (Math.random() * 360 - 180) + 'deg';

        heart.style.setProperty('--tx', tx);
        heart.style.setProperty('--ty', ty);
        heart.style.setProperty('--rot', rot);

        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1200);
      }
    }

    // 3. Render 100 lần "Anh xin lỗi em"
    const btnSorry = document.getElementById('btnSorry');
    const apologyWrapper = document.getElementById('apologyWrapper');
    const apologyList = document.getElementById('apologyList');
    const progressInfo = document.getElementById('progressInfo');

    let hasRendered = false;

    btnSorry.addEventListener('click', (e) => {
      const rect = btnSorry.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      burstHearts(x, y);

      if (hasRendered) return;
      hasRendered = true;

      btnSorry.style.pointerEvents = 'none';
      btnSorry.innerHTML = '<span>Đã gửi trọn vẹn 100 lời xin lỗi</span> 💖';
      apologyWrapper.style.display = 'block';

      const total = 100;
      let count = 0;

      const interval = setInterval(() => {
        count++;
        const item = document.createElement('div');
        item.className = 'apology-item';
        item.innerHTML = `
          <div class="apology-num">${count}</div>
          <div class="apology-text">Anh xin lỗi em <span class="sparkle">❤️</span></div>
        `;
        apologyList.appendChild(item);

        apologyList.scrollTop = apologyList.scrollHeight;
        progressInfo.innerText = `Đã gửi ${count}/${total} lời xin lỗi chân thành ❤️`;

        if (count >= total) {
          clearInterval(interval);
          progressInfo.innerHTML = `🎉 100/100 Lời xin lỗi đã được gửi đến Phương Linh! Đừng giận anh nữa nha 🥺`;
          burstHearts(window.innerWidth / 2, window.innerHeight / 2);
        }
      }, 25);
    });
  </script>
</body>
</html>
